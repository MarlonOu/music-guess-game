<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>最原始 iframe 測試</title>
  <style>
    body { background: #101317; color: #eef0f2; font-family: sans-serif; padding: 24px; }
    iframe { display: block; margin-top: 16px; border: 2px solid #e8b93f; }
  </style>
</head>
<body>
  <h1>最原始 YouTube iframe 測試（不經過任何自訂程式碼）</h1>
  <p>這支影片是 PSY - GANGNAM STYLE，全球嵌入播放次數最高的影片之一。</p>
  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/9bZkp7q19f0"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
  ></iframe>
  <p style="margin-top: 16px;">如果上面這個畫面能正常顯示並播放，問題在我們的程式碼；如果連這個都黑畫面/播不出來，問題在瀏覽器或網路環境。</p>
</body>
</html>
